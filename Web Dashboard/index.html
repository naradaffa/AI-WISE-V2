<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI WISE Dashboard - 10 Devices</title>
    
    <link rel="stylesheet" href="css/style.css">
    <script src="js/chart.js"></script> 
</head>
<body>
    <header>
        <div class="header-titles">
            <h1>AI WISE</h1>
            <p>SISTEM WEARABLE BERBASIS KECERDASAN BUATAN UNTUK PEMANTAUAN REAL-TIME BAHAYA KESELAMATAN PEKERJA KONSTRUKSI DI INDONESIA</p>
        </div>
    </header>

    <main>
        <!-- PANEL KONTROL GLOBAL (SEMUA PEKERJA) -->
        <section class="global-record-panel">
            <button id="btn-start-all" onclick="startRecordAll()">▶ MULAI REKAM SEMUA</button>
            <button id="btn-stop-all" onclick="stopRecordAll()" disabled>⏹ BERHENTI SEMUA</button>
            <a id="btn-download-all" class="btn-download btn-download-all">⬇ DOWNLOAD CSV GABUNGAN (ALL)</a>
            <span id="global-record-status" class="status-text">Status Global: Standby</span>
        </section>

        <!-- CONTAINER DYNAMIC 10 PEKERJA -->
        <div id="dashboard-container"></div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
